<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Book Test Drive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.card{
border:none;
border-radius:15px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold"
href="cars.html">

Car Sales System

</a>

</div>

</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow p-4">

<h2 class="text-center mb-4">

Book Test Drive

</h2>

<form id="bookingForm">

<div class="mb-3">

<label class="form-label">

Selected Car

</label>

<input
type="text"
id="car"
class="form-control"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Phone Number

</label>

<input
type="tel"
id="phone"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

City

</label>

<input
type="text"
id="city"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label class="form-label">

Preferred Date

</label>

<input
type="date"
id="date"
class="form-control"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label class="form-label">

Preferred Time

</label>

<input
type="time"
id="time"
class="form-control"
required>

</div>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Message

</label>

<textarea
id="message"
rows="4"
class="form-control"
placeholder="Any additional requirements...">

</textarea>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success btn-lg">

Submit Booking

</button>

<a
href="cars.html"
class="btn btn-secondary btn-lg">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

document.getElementById("car").value=params.get("car");

document.getElementById("bookingForm")
.addEventListener("submit",function(e){

e.preventDefault();

const booking={

car:document.getElementById("car").value,

name:document.getElementById("name").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

city:document.getElementById("city").value,

date:document.getElementById("date").value,

time:document.getElementById("time").value,

message:document.getElementById("message").value

};

localStorage.setItem(
"lastBooking",
JSON.stringify(booking)
);

alert(
"✅ Test Drive Booked Successfully!"
);

window.location.href="cars.html";

});

</script>

</body>
</html>
